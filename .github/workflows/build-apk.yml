name: Build & Release KEMSININ Dubber APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Python 3.12 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai edge-tts requests

      - name: Make gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect Output APKs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} release-apks/ \;
          echo "Generated APKs:"
          ls -lh release-apks/

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KEMSININ-Dubber-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
